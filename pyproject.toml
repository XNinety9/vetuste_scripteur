[project]
name = "vetuste-scripteur"
version = "1.1.0"
description = "Transforme le français moderne en vieux français façon Les Visiteurs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
web = [
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
]

[project.scripts]
vetuste-scripteur = "vetuste_scripteur.cli:main"

[dependency-groups]
dev = [
    "fonttools>=4.59",
    "httpx>=0.28",
    "pytest>=8",
    "uharfbuzz>=0.50",
    "verbecc>=2.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vetuste_scripteur"]

[tool.pytest.ini_options]
testpaths = ["tests"]
