# À chaque tag vX.Y.Z : teste, construit le .pyz et le joint à une release GitHub, avec sa somme de
# contrôle. Printr le récupère ensuite à une version figée (voir integration/printr/README.md).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Vérifie que le tag correspond à la version du paquet
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' vetuste_scripteur/__init__.py)
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Teste sur la plus ancienne version de Python acceptée
        run: uv run --python 3.11 --extra web pytest

      - name: Construit l'archive
        run: python3 scripts/construire_pyz.py

      - name: Publie la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/vetuste-scripteur.pyz dist/vetuste-scripteur.pyz.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes
